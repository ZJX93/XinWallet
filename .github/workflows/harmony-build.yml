name: 'Build HarmonyOS HAP'

# 推送 harmony/** 或本文件会自动触发；也可在 Actions 页手动 workflow_dispatch。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签（形如 vX.Y.Z），由 auto-tag 派生；留空则自动推导'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-harmony:
    name: 'Build entry HAP (API12 / HarmonyOS NEXT)'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: harmony
    env:
      SDK_DIR: '${{ github.workspace }}/ohos-sdk'
      OHOS_SDK_HOME: '${{ github.workspace }}/ohos-sdk'
      OHOS_BASE_SDK_HOME: '${{ github.workspace }}/ohos-sdk'
      # hvigor（及项目 harmony/hvigorw 的 ensure_sdk_home）依赖 DEVECO_SDK_HOME，
      # CI 中只有 OHOS_SDK_HOME 会导致 00303217 Configuration Error: Invalid value of 'DEVECO_SDK_HOME'。
      # SDK 由 Command Line Tools 内置（Resolve 步骤会动态定位真实 SDK 目录并覆盖本默认值）。
      DEVECO_SDK_HOME: '${{ github.workspace }}/ohos-sdk'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          # 手动派发时 checkout 对应 tag 的代码，保证 HAP 版本与 tag 一致
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 'Set up JDK 17'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 'Set up Node'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 'Resolve HarmonyOS API version from build-profile'
        run: |
          # 从 harmony/build-profile.json5 的 compatibleSdkVersion（如 6.1.1(24)）解析括号里的 API 数字，
          # 注入 OHOS_API_VERSION，仅用于诊断/日志参考（本 zip 已内置 SDK，无需按版本安装组件）。
          VER=$(node -e 'const fs=require("fs");const t=fs.readFileSync("build-profile.json5","utf8");const j=JSON.parse(t);const s=(j.app.products[0]||{}).compatibleSdkVersion||"";const m=s.match(/\((\d+)\)/);console.log(m?m[1]:s);')
          echo "OHOS_API_VERSION=$VER" >> "$GITHUB_ENV"
          echo "从 build-profile.json5 解析到 OHOS_API_VERSION=$VER"

      - name: 'Download HarmonyOS Command Line Tools'
        env:
          CLT_URL: '${{ secrets.HARMONY_COMMANDLINE_TOOLS_URL }}'
        run: |
          set -e
          URL="$CLT_URL"
          if [ -z "$URL" ]; then
            echo "::group::未配置 Secret，尝试从本仓库 GitHub Release(tag=harmony-cli)获取 CLI 资产"
            # 先拿 release id（tags 端点），再直接查 assets 端点（不受 starter 状态影响）
            RID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/harmony-cli" \
              | grep -oE '"id":\s*[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
            if [ -n "$RID" ]; then
              ASSET=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$RID/assets" \
                | grep -oE '"browser_download_url":\s*"https://[^"]*commandline-tools-linux-x64[^"]*\.zip"' \
                | head -1 | sed -E 's/.*"(https:[^"]+)".*/\1/' || true)
              URL="$ASSET"
            fi
            echo "Release 资产 (release_id=$RID): ${URL:-（无）}"
            echo "::endgroup::"
          fi
          if [ -z "$URL" ]; then
            echo '::error::未配置 Command Line Tools 下载源，无法安装 SDK。二选一：① 在仓库 Settings > Secrets 添加 HARMONY_COMMANDLINE_TOOLS_URL（华为官网"Command Line Tools for HarmonyOS"的 Linux 压缩包直链，或 ErBWs/ohos-sdk 镜像 .tar.gz.aa）；② 把该 zip 上传到本仓库 Release（tag 名填 harmony-cli，文件名 commandline-tools-linux-x64.zip）。详见 docs/harmony-build.md'
            exit 1
          fi
          echo "下载 CLI: $URL"
          mkdir -p "$HOME/commandline-tools"

          # 支持三种 CLI 包格式：zip / 单文件 tar.gz / ErBWs/ohos-sdk 分卷 (.aa + .ab)
          case "$URL" in
            *.tar.gz.aa|*.tar.gz.ab)
              BASE="${URL%.aa}"; BASE="${BASE%.ab}"
              # sha256 文件内嵌的目标文件名（BASE 已经以 .tar.gz 结尾）
              TARBALL="$(basename "${BASE}")"
              echo "分卷格式 ErBWs/ohos-sdk，tarball=${TARBALL}"
              curl -fL --location-trusted -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "${BASE}.aa" -o clt.tar.gz.aa
              curl -fL --location-trusted -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "${BASE}.ab" -o clt.tar.gz.ab
              cat clt.tar.gz.aa clt.tar.gz.ab > "${TARBALL}"
              if curl -fsL --location-trusted -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "${BASE}.sha256" -o clt.tar.gz.sha256 2>/dev/null; then
                echo "已下载校验和，验证..."
                sha256sum -c clt.tar.gz.sha256
              else
                echo "无校验和，跳过"
              fi
              tar -xzf "${TARBALL}" -C "$HOME/commandline-tools"
              ;;
            *.tar.gz)
              curl -fL --location-trusted -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$URL" -o clt.tar.gz
              tar -xzf clt.tar.gz -C "$HOME/commandline-tools"
              ;;
            *.zip)
              # 私有仓库 Release 资产经 302 跳转到 objects.githubusercontent.com，需 --location-trusted 转发 token
              curl -fL --location-trusted -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$URL" -o clt.zip
              unzip -q clt.zip -d "$HOME/commandline-tools"
              ;;
            *)
              echo "::error::不支持的 CLI URL 格式（需 .zip / .tar.gz / .tar.gz.aa）：$URL"
              exit 1
              ;;
          esac

          # 华为官方 CLI 解压后工具在 command-line-tools/bin 等嵌套目录，布局随版本变化。
          # 为稳妥，递归把解压目录下所有 bin/ 目录都加入 PATH，再按关键可执行文件名兜底定位，确保 ohpm/hvigorw 可用。
          # 注意：本 zip 已内置完整 SDK（sdk/default/openharmony 下含 ets/js/native），不存在、也不需要 sdkmgr 安装步骤。
          # GitHub Actions 对 bash 默认加 -o pipefail，find | head 会因 SIGPIPE 让管道失败而触发 set -e 退出，
          # 因此所有 find | head 都追加 || true 吞掉这种“预期内”的管道中断。
          find "$HOME/commandline-tools" -type d -name bin 2>/dev/null | while IFS= read -r b; do
            echo "$b" >> "$GITHUB_PATH"
            echo "PATH+ $b"
          done
          for exe in ohpm hvigorw; do
            p=$(find "$HOME/commandline-tools" -type f -name "$exe" 2>/dev/null | head -1 || true)
            if [ -n "$p" ]; then
              d=$(dirname "$p")
              echo "$d" >> "$GITHUB_PATH"
              echo "PATH+ $d ($exe)"
            fi
          done
          echo "::group::CLI 目录结构（前4层）与工具位置"
          find "$HOME/commandline-tools" -maxdepth 4 2>/dev/null | head -60 || true
          echo "--- 关键工具文件 ---"
          find "$HOME/commandline-tools" -type f \( -name 'ohpm' -o -name 'hvigorw' \) 2>/dev/null | head -20 || true
          echo "::endgroup::"
          echo "::group::内置 SDK 概览（sdk/default 下 ets/js/native/previewer）"
          find "$HOME/commandline-tools" -maxdepth 6 -type d \( -name ets -o -name js -o -name native -o -name previewer \) 2>/dev/null | head -40 || true
          echo "::endgroup::"

      - name: 'Resolve SDK home & build versioned SDK layout for hvigor'
        run: |
          set -e
          # 本 zip（华为官方 Command Line Tools）已内置完整 SDK，但布局是扁平的：
          #   <CLI>/sdk/default/openharmony/{ets,js,previewer,native}   （无 API 版本号子目录）
          # 而 hvigor 按 DEVECO_SDK_HOME/<apiVersion>/openharmony/{ets,...} 查找（之前 sdkmgr 装出的就是这种
          # 带版本目录的布局）。因此这里为内置 SDK 补一层软链接：SDK_ROOT/<apiVersion>/openharmony -> 内置扁平 openharmony，
          # 让 hvigor 能定位。兼容嵌套（$HOME/commandline-tools/command-line-tools/...）与扁平（$HOME/commandline-tools/...）布局。
          CLI="$HOME/commandline-tools"
          OPENHARMONY=""
          HMS=""
          SDK_ROOT=""
          for base in "$CLI/command-line-tools/sdk/default" "$CLI/sdk/default" "$CLI/command-line-tools/sdk" "$CLI/sdk" "$SDK_DIR"; do
            if [ -d "$base/openharmony/ets" ]; then
              OPENHARMONY="$base/openharmony"; HMS="$base/hms"; SDK_ROOT="$base"; break
            fi
            if [ -d "$base/ets" ]; then
              OPENHARMONY="$base"; HMS="$(dirname "$base")/hms"; SDK_ROOT="$(dirname "$base")"; break
            fi
          done
          if [ -z "$OPENHARMONY" ]; then
            echo "::error::未找到内置 openharmony SDK（需含 ets 子目录）。请确认下载的 zip 是华为官方『Command Line Tools for HarmonyOS』完整包。"
            echo "--- 查找 openharmony 目录 ---"; find "$CLI" -maxdepth 6 -type d -name openharmony 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "内置 openharmony SDK: $OPENHARMONY (SDK_ROOT=$SDK_ROOT)"
          # 工程 compatibleSdkVersion 形如 6.1.1(24)。hvigor 用其中括号里的数字作版本目录名（也可能用 6.1.1），
          # 两种都建软链，确保命中。
          API_DIGIT=$(echo "${OHOS_API_VERSION:-24}" | grep -oE '[0-9]+' | head -1)
          # 工程 compatibleSdkVersion 完整串（如 6.1.1(24)）：华为官方 SDK 目录名就是带括号的
          # "<version>(<api>)" 格式，hvigor 按 compatibleSdkVersion 原值查找 SDK 版本目录。
          # 仅建数字版(24)/纯版本版(6.1.1)仍会 00303312，必须把完整串也建一份软链目录。
          COMPAT_VER=$(node -e 'const fs=require("fs");const t=fs.readFileSync("build-profile.json5","utf8");const j=JSON.parse(t);const s=(j.app.products[0]||{}).compatibleSdkVersion||"";console.log(s);')
          # 关键修复：不再只手写 openharmony/hms 两个软链，而是把 SDK_ROOT 下所有真实子目录
          # （openharmony/hms/js/native/previewer/toolchains...）全部挂进版本目录 <version>/ 下，
          # 这样 hvigor 不论要 <version>/openharmony 还是 <version>/native 都能命中，避免 00303312。
          # 同时跳过与版本名同名的目录，避免自引用死链。
          link_sdk_version() {
            local v="$1"
            [ -z "$v" ] && return 0
            local vdir="$SDK_ROOT/$v"
            mkdir -p "$vdir"
            for child in "$SDK_ROOT"/*/; do
              [ -d "$child" ] || continue
              local name; name=$(basename "$child")
              [ "$name" = "$v" ] && continue
              ln -sfn "$child" "$vdir/$name"
            done
            # 版本目录下的 sdk-pkg.json 等文件也要挂进去：hvigor 可能靠它识别该目录对应的 SDK 版本，
            # 只有 openharmony/hms 软链而无版本描述文件时仍会 00303312。
            for f in "$SDK_ROOT"/*; do
              [ -f "$f" ] || continue
              local fname; fname=$(basename "$f")
              ln -sfn "$f" "$vdir/$fname"
            done
            echo "软链版本目录: $vdir -> $(ls -1 "$vdir" 2>/dev/null | tr '\n' ' ')"
          }
          for v in "$API_DIGIT" "6.1.1" "6.1.1.300" "$COMPAT_VER"; do
            link_sdk_version "$v"
          done
          echo "DEVECO_SDK_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: 'Configure .npmrc (resolve @ohos plugin)'
        run: |
          # hvigor 通过 pnpm 拉取 @ohos/hvigor-ohos-plugin，必须在 .npmrc 声明 @ohos scope 的 registry，
          # 否则报 "No npmrc file is matched"。写到工程根与 $HOME 两处，兼容 hvigor 的查找路径。
          echo '@ohos:registry=https://repo.harmonyos.com/npm/' > .npmrc
          echo '@ohos:registry=https://repo.harmonyos.com/npm/' > "$HOME/.npmrc"
          echo "已写入 .npmrc (@ohos scope -> repo.harmonyos.com/npm)"

      - name: 'Verify hvigor (use CLI-bundled)'
        run: |
          # 华为 hvigor 不在公共 npm registry，CI 使用 Command Line Tools 自带的 hvigorw（已在 PATH）。
          if command -v hvigorw >/dev/null 2>&1; then
            echo "hvigorw: $(command -v hvigorw)"
            hvigorw -v 2>&1 | head -3 || true
          else
            echo "::error::hvigorw 不在 PATH（Command Line Tools 的 bin 应已加入 PATH）"
            exit 1
          fi

      - name: 'Install module dependencies'
        run: |
          command -v ohpm >/dev/null 2>&1 || npm install -g @ohos/ohpm-cli
          ohpm install

      # ----------------------------------------------------------------------------
      # 版本计算：与安卓同源
      # - 优先使用 auto-tag 派发的 tag（vX.Y.Z），保证鸿蒙 HAP 版本号与安卓 APK 完全一致；
      # - 手动派发未带 tag 时，自 latest v* 推导 patch+1（与 android-build 兜底逻辑一致）。
      # 同时把版本号注入 AppScope/app.json5（versionName/versionCode），使 HAP 内部版本与安卓对齐。
      # ----------------------------------------------------------------------------
      - name: 'Compute version & inject into Harmony app.json5'
        id: hm_version
        run: |
          set -e
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=""
          fi
          if [ -n "$TAG" ]; then
            VER=${TAG#v}
          else
            LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              VER="0.0.0"
            else
              VER=${LATEST#v}
              MAJOR=$(echo "$VER" | cut -d. -f1)
              MINOR=$(echo "$VER" | cut -d. -f2)
              PATCH=$(echo "$VER" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VER="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          # 与安卓一致的 versionCode 映射：v0.0.1→1, v0.0.5→5, v0.0.35→35, v1.2.3→10203
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          [ "$CODE" -eq 0 ] && CODE=1
          NEW_TAG="v${VER}"
          echo "VERSION_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Harmony version: $NEW_TAG (versionName=$VER, versionCode=$CODE)"
          export VERSION_NAME="$VER"
          export VERSION_CODE="$CODE"
          node -e '
            const fs=require("fs");
            const p="AppScope/app.json5";
            const j=JSON.parse(fs.readFileSync(p,"utf8"));
            j.app.versionName=process.env.VERSION_NAME;
            j.app.versionCode=Number(process.env.VERSION_CODE);
            fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n");
            console.log("已注入 app.json5 version:", j.app.versionName, j.app.versionCode);
          '

      # ----------------------------------------------------------------------------
      # 签名方案（方案 B）：CI 直接出「真签名」HAP
      # 本地 DevEco 自动签名在 C:\Users\XIN\.ohos\config\ 下生成了
      #   default_harmony_*.{cer,p7b,p12}  +  material/{ac,ce,fd}/ 加密目录
      # 这些素材已打包 base64 存入 Secret HARMONY_SIGN_BUNDLE_B64。
      # hvigor 6.24+ 自定义签名必须用 material/ 加密目录（明文密码 JSON 会 ENOENT）。
      # 这里：base64 解码 -> 解压到 .sign/ -> 注入「相对路径 + material」签名配置。
      # material 目录与 storeFile 同处 .sign/ 下，hvigor 自动按兄弟目录解析。
      # ----------------------------------------------------------------------------
      - name: 'Prepare signing config (decode bundle)'
        id: sign
        env:
          SIGN_BUNDLE_B64: '${{ secrets.HARMONY_SIGN_BUNDLE_B64 }}'
        run: |
          if [ -z "$SIGN_BUNDLE_B64" ]; then
            echo '::warning::未配置 HARMONY_SIGN_BUNDLE_B64，将以“仅编译验证”模式运行（不产出可安装 HAP）。如需出包请在仓库 Settings > Secrets 添加 HARMONY_SIGN_BUNDLE_B64（由本地 .ohos/config 的证书 + material 打包的 base64 zip）。'
            node -e '
              const fs=require("fs");
              const p="build-profile.json5";
              const j=JSON.parse(fs.readFileSync(p,"utf8"));
              (j.app.products||[]).forEach(pr=>{ if(pr.signingConfig==="default"){ pr.signingConfig=""; } });
              fs.writeFileSync(p, JSON.stringify(j,null,2));
              console.log("已将 product.signingConfig 置空（编译验证模式）");
            '
            echo "signing=compile-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -e
          mkdir -p .sign
          echo "$SIGN_BUNDLE_B64" | base64 -d > .sign/bundle.zip
          ( cd .sign && unzip -oq bundle.zip )
          echo "解压出: $(ls .sign)"
          node -e '
            const fs=require("fs");
            const p="build-profile.json5";
            const j=JSON.parse(fs.readFileSync(p,"utf8"));
            const base=".sign/default_harmony_skfFPKZFVT0dUaIs8qMogD2btVtk3s9CXYn2H-KglNg=";
            j.app.signingConfigs=[{
              name:"default", type:"HarmonyOS",
              material:{
                certpath:  base+".cer",
                keyAlias:  "debugKey",
                keyPassword:"0000001B2148F9CCC2554BEBCCC4DF5CC76E5559B5E26494E28B65A2B11DE527C16244DEF201C9793729DA",
                profile:   base+".p7b",
                signAlg:   "SHA256withECDSA",
                storeFile: base+".p12",
                storePassword:"0000001B5B987F7717A0E9D551B4F3D1031F9EBEF044797F58CE4F410547E78F58EB55000832BC3FCC485B"
              }
            }];
            fs.writeFileSync(p, JSON.stringify(j,null,2));
            console.log("已注入 bundle 签名配置（相对路径 + material 加密目录）");
          '
          echo "signing=real" >> "$GITHUB_OUTPUT"

      - name: 'Build HAP (compile verification)'
        run: |
          chmod +x hvigorw
          ./hvigorw --mode module -p module=entry@default -p product=default assembleHap

      - name: 'Analyze build result'
        run: |
          SIGNING="${{ steps.sign.outputs.signing }}"
          echo "签名模式: $SIGNING"
          HAP=$(find entry/build -name '*.hap' 2>/dev/null | head -1 || true)
          if [ -n "$HAP" ]; then
            echo "::notice::HAP 产出成功 ✅ -> $HAP"
          elif [ "$SIGNING" = "real" ]; then
            echo "::error::已配置签名但仍未产出 HAP，说明编译/签名注入有问题。"
            exit 1
          else
            echo "::warning::编译验证通过 ✅（源码可过 hvigor 编译），但「仅编译验证」模式按设计不产出 HAP。请在仓库 Settings > Secrets 配置 HARMONY_SIGN_* 6 项，重跑即可出可安装 HAP。"
          fi

      - name: 'Upload HAP artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'xinwallet-entry-hap'
          path: 'harmony/entry/build/default/outputs/default/*.hap'
          if-no-files-found: ignore

      # ----------------------------------------------------------------------------
      # 发布到 GitHub Release（仅限工作流派发，即 auto-tag 同源触发的正式发布）
      # - 签名 HAP 重命名为 XinWallet.harmony.v{tag}.hap；
      # - 同源派发的 android-build 会用同一 tag 创建 Release「XinWallet APP v{tag}」，
      #   此处等待其就绪后把 HAP 作为资产追加进去（版本号与安卓完全一致）；
      #   若等待超时（安卓尚未建 Release），则自行创建同名 Release 并附带 HAP，避免阻塞。
      # ----------------------------------------------------------------------------
      - name: 'Publish HAP to GitHub Release'
        # 同 android-build：派发时 github.ref 是分支而非 tag，需显式并入「派发且带 tag」，
        # 否则派发构建只出 HAP、不会挂到 Release 上。
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ env.VERSION_TAG }}"
          SRC=$(find entry/build -name '*-signed.hap' 2>/dev/null | head -1)
          [ -z "$SRC" ] && SRC=$(find entry/build -name '*.hap' 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::未找到 HAP，无法发布到 Release"; exit 1
          fi
          DEST="entry/build/default/outputs/default/XinWallet.harmony.${TAG}.hap"
          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"
          echo "::notice::HAP 资产: $DEST ($(du -h "$DEST" | cut -f1))"
          # 各构建相互独立：先确保 Release 存在（已存在则忽略），再追加本构建资产，
          # 不再阻塞等待其他构建。谁先完成谁建 Release，其余只挂自己的资产。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加 HAP 资产"
          else
            echo "创建 Release $TAG 并附带 HAP"
            gh release create "$TAG" \
              --title "XinWallet APP $TAG" \
              --notes "自动构建安装包（版本 $TAG）。\n- 鸿蒙 HAP：XinWallet.harmony.$TAG.hap\n- 安卓 APK：由 android-build 工作流产出" \
              "$DEST" || echo "::warning::Release 创建失败（可能已被其他构建抢先创建），继续尝试上传"
          fi
          gh release upload "$TAG" "$DEST" --clobber
          gh release edit "$TAG" --draft=false
          echo "::notice::已发布 HAP -> Release $TAG : XinWallet.harmony.$TAG.hap"
