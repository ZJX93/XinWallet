name: PR Test Gate

# M7 · CI 测试门禁
# 在 PR / 主干 push 时自动跑：依赖安装 → 数据库 schema 初始化 → 测试套件 → 路由挂载校验。
# 目标：让“有完整测试套件却不在 CI 跑”成为历史，PR 不能带病合并。
on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Route Verify
    runs-on: ubuntu-latest

    # PostgreSQL 16 服务容器，供集成测试使用（与本地 docker-compose 一致）
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xinwallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: xinwallet
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL to be ready
        run: |
          # pg_isready -d xinwallet 检查目标数据库是否已创建（POSTGRES_DB 环境变量会触发 Docker 镜像自动建库）
          # Docker 容器报告就绪（TCP 端口开放）≠ xinwallet 数据库已创建完毕，此处多等一步更稳妥
          for i in $(seq 1 30); do
            if PGPASSWORD=postgres pg_isready -h localhost -p 5432 -U postgres -d xinwallet -q 2>/dev/null; then
              echo "PostgreSQL and xinwallet database are ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL xinwallet database... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Initialize database schema
        # schema.sql 内含系统分类种子（is_system），一次性建表 + 种子
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5: initializing database schema..."
            if PGPASSWORD=postgres psql -h localhost -U postgres -d xinwallet -v ON_ERROR_STOP=1 -f server/schema.sql; then
              echo "Database schema initialized successfully."
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying in 5s..."
            sleep 5
          done
          echo "Database schema initialization failed after 5 attempts."
          exit 1

      - name: Run test suite
        # 逐文件 + 单文件超时（npm test 跑在一起时，任一用例挂起就会静默拖到 6 小时 job 超时）
        # 单文件默认超时 120s，可用 CI_FILE_TIMEOUT_MS 覆盖
        timeout-minutes: 45
        run: npm run test:ci

      - name: Verify routes mounted
        # 静态校验：所有 routes/*.js 定义的路由都已在 routes.js 挂载，防止漏挂
        run: npm run test:routes

  # ------------------------------------------------------------------
  # MySQL 方言回归：与上面的 PostgreSQL job 并行，覆盖 DB_DIALECT=mysql 分支。
  #
  # ⛔ 为什么必须有：项目对外提供 4 个 compose 变体，其中 2 个是 MySQL，
  #    但 CI 此前只跑 PostgreSQL，等于 MySQL 路径零自动化验证。
  #    历史上业务代码里硬编码 MySQL 专有语法（INSERT IGNORE）与
  #    PG 专有函数（TO_CHAR）互相踩踏，正是缺少这类回归网的直接后果。
  # ------------------------------------------------------------------
  test-mysql:
    name: Test (MySQL dialect)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xinwallet
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_DIALECT: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: xinwallet
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL ($i/30)..."
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Initialize MySQL schema
        # 用项目自带脚本（自动建库 + 分块执行 schema.mysql.sql），
        # 与 db.js 的运行时自愈路径保持一致，避免 CI 另起一套建表逻辑。
        run: npm run mysql:init

      - name: Run test suite (mysql)
        timeout-minutes: 45
        run: npm run test:ci
