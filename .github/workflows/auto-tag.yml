# ============================================
# 鑫钱包 · 自动版本标签（统一版本线）
# 触发条件：「PR Test Gate」在 main 分支上【成功完成】后触发；测试不通过则不打标、不发版
#          （另保留 workflow_dispatch 作为事件丢失时的手动兜底）
# 行为：根据 Conventional Commits 规范自动计算版本号，创建并推送 vX.Y.Z tag
#       （整个仓库——Web/后端 + 安卓客户端——共用这一套版本号，保证镜像与 APK 版本对齐）
# 连锁效果：tag 创建后，以下三个 workflow 均监听 push: tags，会被自动触发：
#   - release-image.yml（构建 Docker 镜像）、android-build.yml（构建 APK）、harmony-build.yml（构建 HAP）
#   三者均使用该 vX.Y.Z 标签，从而镜像 / APK / HAP 版本始终保持一致，无需手动派发。
# 版本规则（简化）：
#   版本号固定为 v0.1.X —— 锁死 MAJOR.MINOR = 0.1，每次发布仅递增 PATCH(X)。
#   例：v0.1.1 → v0.1.2 → v0.1.3 …（不再做 major/minor 跳变）。
#   是否发布：仅 docs/chore/ci/test 及 Merge/Revert 提交跳过打标签；
#   其余提交（含中文标题的修复/重构/UI 调整等）都会触发一次 X+1 发布，
#   保证「push main → 自动打标 → 自动出镜像/APK/HAP」链路对中文提交同样生效。
# 注意：如需调整锁定的 X.Y，改下方 MAJOR/MINOR 两个常量即可。
# ============================================
name: Auto Tag

on:
  # 关键：用 workflow_run 监听测试门禁，而不是 push:branches:[main]。
  # push 触发时测试还没跑完，存在「测试失败但 tag 已推出、下游镜像/APK 跟着发布」的窗口；
  # workflow_run 保证「PR Test Gate 全绿」是打标签的前置条件，
  # 且 tag 落在【通过测试的那个 commit】上（见 checkout 的 ref）。
  workflow_run:
    workflows: ["PR Test Gate"]
    types: [completed]
    branches: [main]
  # 兜底：门禁事件丢失 / 需要补发标签时手动触发
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # 门禁闸门：把「测试有没有过」变成 Actions 上一目了然的绿勾/红叉，
  # 而不是让 auto-tag 静默跳过、事后查不出这一版为什么没发出来。
  # 同时解出两个下游要用的值：是否放行 + 待打标的 commit。
  # ---------------------------------------------------------------
  gate:
    name: PR Test Gate 结果
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: 校验门禁结论
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # 手动派发：门禁不适用，直接以默认分支 HEAD 打标
          if [ "$EVENT" != "workflow_run" ]; then
            echo "::notice::手动派发，跳过门禁校验"
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "门禁 run: ${RUN_URL:-（无链接）}"

          # PR 源分支上的测试不参与自动打标（branches 已过滤，这里是双保险）
          if [ "$HEAD_BRANCH" != "main" ]; then
            echo "::notice::触发本次测试的是 ${HEAD_BRANCH} 分支，非 main，不打标"
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "sha=$HEAD_SHA" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::PR Test Gate 未通过（conclusion=${CONCLUSION}），已中止自动打标: ${RUN_URL}"
            exit 1
          fi

          echo "::notice::PR Test Gate 通过: ${RUN_URL}"
          echo "proceed=true" >> $GITHUB_OUTPUT
          echo "sha=$HEAD_SHA" >> $GITHUB_OUTPUT

  auto-tag:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 无 PAT 时用 gh workflow run 派发下游构建，派发 workflow 需要 actions: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 打标对象 = 通过测试的那个 commit，而非默认分支的最新 HEAD
          ref: ${{ needs.gate.outputs.sha }}
          fetch-tags: true
          fetch-depth: 0

      - name: 计算下一个版本号
        id: version
        run: |
          # 获取按版本号排序的最新 tag
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "new_tag=v0.1.1" >> $GITHUB_OUTPUT
            echo "No existing tags, starting at v0.1.1"
            exit 0
          fi

          echo "Latest tag: $LATEST_TAG"

          # 解析当前版本号：仅取 PATCH(X)；MAJOR.MINOR 锁死为 0.1
          VERSION=${LATEST_TAG#v}
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          MAJOR=0
          MINOR=1

          # 获取自上次 tag 以来的所有 commit 主题（首行）
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s")

          echo "Commits since ${LATEST_TAG}:"
          echo "$COMMITS"
          echo ""

          # 仅当自上次 tag 以来【全部】提交都是 docs/chore/ci/test/Merge/Revert 时才跳过发布；
          # 其余提交（包括中文标题）都会触发打标签，确保镜像/APK/HAP 正常出包。
          if ! echo "$COMMITS" | grep -vE "^(docs|chore|ci|test)(\(.+\))?!?:|^Merge |^Revert " | grep -q .; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Only docs/chore/ci/test/Merge/Revert commits since last tag, skipping"
            exit 0
          fi

          # 锁死 X.Y = 0.1，版本号只递增 PATCH(X)：v0.1.N → v0.1.(N+1)
          PATCH=$((PATCH + 1))

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "Bump type: patch (X only, X.Y locked to 0.1)"
          echo "Next version: ${NEW_TAG}"

      - name: 创建并推送 tag
        id: push
        if: steps.version.outputs.skip == 'false'
        env:
          # 用 PAT 推送 tag 才能触发下游 on: push: tags 的 workflow
          # （GitHub anti-loop：GITHUB_TOKEN 推送的 tag 不会触发其他 workflow，
          #   因此 release-image / android-build / harmony-build 不会被自动拉起）
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" \
            -m "chore(release): ${{ steps.version.outputs.new_tag }}"
          if [ -n "$RELEASE_PAT" ]; then
            git push "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git" "${{ steps.version.outputs.new_tag }}"
            echo "used_pat=true" >> $GITHUB_OUTPUT
          else
            git push origin "${{ steps.version.outputs.new_tag }}"
            echo "used_pat=false" >> $GITHUB_OUTPUT
            echo "::warning::未配置 secrets.RELEASE_PAT：tag 由 GITHUB_TOKEN 推送，不会拉起下游 on:push:tags 构建，已改用 workflow_dispatch 派发兜底。"
          fi

      - name: 派发下游构建（镜像 / APK / HAP）
        # 仅在未使用 PAT 时需要：GITHUB_TOKEN 推送的 tag 不会拉起 on: push: tags 的 workflow
        # （GitHub anti-loop）。这里改用 workflow_dispatch 显式派发同一个 tag，
        # 保证「push main → 自动打 tag → 自动出镜像/APK/HAP」链路不断。
        # 三个下游 workflow 均已声明 workflow_dispatch 且输入为 tag，并已支持按 tag 发布产物。
        if: steps.version.outputs.skip == 'false' && steps.push.outputs.used_pat == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.new_tag }}"
          for wf in release-image.yml android-build.yml harmony-build.yml; do
            if gh workflow run "$wf" --ref main -f tag="$TAG"; then
              echo "::notice::已派发 $wf (tag=$TAG)"
            else
              echo "::warning::$wf 派发失败"
            fi
          done

      - name: 清理遗留的失败 Release（v0.1.66 缺 HAP）
        # 一次性清理：v0.1.66 的鸿蒙构建失败，其 Release 仅含 APK、无 HAP。
        # 幂等：Release 不存在时静默跳过，后续 auto-tag 运行自动 no-op。
        # 不依赖 version.skip：即使是 ci/chore 提交（不会发新版），也照常执行清理。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.66 >/dev/null 2>&1; then
            echo "删除遗留 Release v0.1.66（缺 HAP）"
            gh release delete v0.1.66 --yes || echo "::warning::v0.1.66 删除失败，可手动处理"
          else
            echo "v0.1.66 Release 不存在，跳过清理"
          fi


