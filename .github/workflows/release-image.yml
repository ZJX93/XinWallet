# ============================================
# 鑫钱包 · 自动构建 Docker 镜像
# 触发条件：
#   - 手动 workflow_dispatch（tag 输入，由 auto-tag.yml 派发，形如 vX.Y.Z）
#   - 推送形如 vX.Y.Z 的 tag（人工兜底）
# 行为：构建多架构镜像（amd64 + arm64），推送到 GitHub Container Registry
# 版本号：与安卓客户端共用 vX.Y.Z（由 auto-tag.yml 统一推导），镜像 tag 同步为
#         ghcr.io/zjx93/xin-wallet/xinwallet:vX.Y.Z 外加 :latest
# ============================================
name: Build & Publish Docker Image

# 同一分支/标签同一时间仅允许一个构建运行，避免堆积
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动构建的版本号'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  # 镜像名必须全小写。GitHub Actions 表达式不支持 lower()，改用 shell tr。
  IMAGE_REPO_LOWER: xin-wallet

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # workflow_dispatch 时 checkout 对应 tag 的代码，而非默认分支 HEAD
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 一个 step 同时计算 tag + 转小写 owner，输出供后续步骤引用
      - name: 准备镜像配置
        id: setup
        run: |
          # 1) 计算 VERSION（推送的 tag / 手动参数 / dev-<sha>）
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION=${{ github.event.inputs.tag }}
          else
            VERSION=dev-${GITHUB_SHA::7}
          fi
          # 2) owner 转小写（OCI 镜像名要求小写）
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_PATH="${OWNER_LOWER}/${IMAGE_REPO_LOWER}/xinwallet"
          FULL_TAG="${REGISTRY}/${IMAGE_PATH}:${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "IMAGE_PATH=${IMAGE_PATH}" >> $GITHUB_OUTPUT
          echo "FULL_TAG=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "📦 ${FULL_TAG}"

      # 加密密钥不在构建期内嵌（审计 H1 修复）：
      # 原实现生成 ENCRYPTION_KEY 并以 build-arg 传入，但 Dockerfile 从未声明
      # ARG ENCRYPTION_KEY——密钥从未进入镜像（Docker 静默告警 not consumed），
      # 且"密钥内嵌镜像层"本身是反模式（公开镜像可被分层提取）。
      # 现改为运行期注入：docker run -e ENCRYPTION_KEY=<64hex>，
      # 或依赖数据卷 /app/data/.encryption-key（crypto.js 首次启动自动生成）。
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # ENCRYPTION_KEY 不参与构建（见上方说明）：运行期 -e 注入或数据卷自动生成
          build-args: |
            VERSION=${{ steps.setup.outputs.VERSION }}
          tags: |
            ${{ steps.setup.outputs.FULL_TAG }}
            ${{ env.REGISTRY }}/${{ steps.setup.outputs.IMAGE_PATH }}:latest
          labels: |
            org.opencontainers.image.title=XIN Wallet
            org.opencontainers.image.description=鑫钱包 - 个人财务助手
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建摘要
        if: success()
        run: |
          echo "✅ 镜像构建完成:"
          echo "  ${{ steps.setup.outputs.FULL_TAG }}"
          echo "  ${{ env.REGISTRY }}/${{ steps.setup.outputs.IMAGE_PATH }}:latest"
          echo ""
          echo "📋 pull:"
          echo "  docker pull ${{ steps.setup.outputs.FULL_TAG }}"
