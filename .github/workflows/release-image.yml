# ============================================
# 鑫钱包 · 自动构建 Docker 镜像
# 触发前置条件：Auto Tag 工作流【完成】后（workflow_run，与 android-build 一致）。
#   auto-tag 仅在「PR Test Gate 全绿」后才打 vX.Y.Z 标，镜像/APK/HAP 版本始终对齐；
#   auto-tag 因仅 docs/chore/ci/test 跳过打标时，由 gate 作业跳过（不构建）。
# 另保留 workflow_dispatch 作为手动兜底（带 tag 则推送正式镜像，留空仅验证构建）。
# 行为：构建多架构镜像（amd64 + arm64），推送到 GitHub Container Registry
# 版本号：与安卓客户端共用 vX.Y.Z（由 auto-tag.yml 统一推导），镜像 tag 同步为
#         ghcr.io/zjx93/xin-wallet/xinwallet:vX.Y.Z 外加 :latest
# ============================================
name: Build & Publish Docker Image

# 同一分支/标签同一时间仅允许一个构建运行，避免堆积
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

on:
  # 前置条件：Auto Tag 完成后触发（与 android-build 一致）。auto-tag 仅在
  # 「PR Test Gate 全绿」后才打 vX.Y.Z 标，镜像/APK/HAP 版本始终对齐。
  workflow_run:
    workflows: ["Auto Tag"]
    types: [completed]
    branches: [ main, master ]
  # 手动兜底
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签（形如 vX.Y.Z）；留空则构建 dev-<sha> 不推送'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  # 镜像名必须全小写。GitHub Actions 表达式不支持 lower()，改用 shell tr。
  IMAGE_REPO_LOWER: xin-wallet

jobs:
  # 门禁：仅当 auto-tag 在本次 commit 上打了 vX.Y.Z 标才放行构建（与 android-build 一致）
  gate:
    name: 版本门禁
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: 判断是否需构建
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$TAG" ]; then
              echo "::notice::Auto Tag 未在本次 commit 上打标（可能仅 docs/chore/ci/test），跳过镜像构建。"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Auto Tag 已打标 $TAG，开始构建镜像。"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.tag || github.ref }}

      # 一个 step 同时计算 tag + 转小写 owner，输出供后续步骤引用
      - name: 准备镜像配置
        id: setup
        run: |
          # 版本号由 gate 作业统一解出：workflow_run 取 auto-tag 打的标；手动派发取输入（可空）
          TAG="${{ needs.gate.outputs.tag }}"
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION=dev-${GITHUB_SHA::7}
          fi
          # 2) owner 转小写（OCI 镜像名要求小写）
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_PATH="${OWNER_LOWER}/${IMAGE_REPO_LOWER}/xinwallet"
          FULL_TAG="${REGISTRY}/${IMAGE_PATH}:${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "IMAGE_PATH=${IMAGE_PATH}" >> $GITHUB_OUTPUT
          echo "FULL_TAG=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "📦 ${FULL_TAG}"

      # 加密密钥不在构建期内嵌（审计 H1 修复）：
      # 原实现生成 ENCRYPTION_KEY 并以 build-arg 传入，但 Dockerfile 从未声明
      # ARG ENCRYPTION_KEY——密钥从未进入镜像（Docker 静默告警 not consumed），
      # 且"密钥内嵌镜像层"本身是反模式（公开镜像可被分层提取）。
      # 现改为运行期注入：docker run -e ENCRYPTION_KEY=<64hex>，
      # 或依赖数据卷 /app/data/.encryption-key（crypto.js 首次启动自动生成）。
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # 仅在有真实版本 tag（正式发布）时推送；手动派发未带 tag 时只构建验证、不推送
          push: ${{ needs.gate.outputs.tag != '' }}
          # ENCRYPTION_KEY 不参与构建（见上方说明）：运行期 -e 注入或数据卷自动生成
          build-args: |
            VERSION=${{ steps.setup.outputs.VERSION }}
          tags: |
            ${{ steps.setup.outputs.FULL_TAG }}
            ${{ env.REGISTRY }}/${{ steps.setup.outputs.IMAGE_PATH }}:latest
          labels: |
            org.opencontainers.image.title=XIN Wallet
            org.opencontainers.image.description=鑫钱包 - 个人财务助手
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建摘要
        if: success()
        run: |
          echo "✅ 镜像构建完成:"
          echo "  ${{ steps.setup.outputs.FULL_TAG }}"
          echo "  ${{ env.REGISTRY }}/${{ steps.setup.outputs.IMAGE_PATH }}:latest"
          echo ""
          echo "📋 pull:"
          echo "  docker pull ${{ steps.setup.outputs.FULL_TAG }}"
