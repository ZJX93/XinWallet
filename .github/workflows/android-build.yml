# ============================================
# 鑫钱包 · Android 客户端构建与发布
# 版本与 Web/后端共用同一套「版本号」vX.Y.Z（由 auto-tag.yml 统一推导并派发），
# 因此 Docker 镜像与安卓 APK 永远版本对齐，不再维护独立的 Web 版本线。
# 触发：
#   - pull_request：仅做真编译验证（不发布）。
#   - workflow_dispatch（由 auto-tag.yml 派发，带 tag 输入）：编译 APK 并创建 GitHub Release。
# 版本号来源：优先使用派发的 tag（vX.Y.Z）；手动派发未带 tag 时自 latest v* 推导 patch+1。
# 产物：GitHub Release 里的 XinWallet android vX.Y.Z.apk（debug 签名，可侧载安装，无需 Google Play）。
# ============================================
name: Android Build

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签（形如 vX.Y.Z），由 auto-tag 派生；留空则自动推导'
        required: false
        default: ''

# 同一分支同时仅允许一个构建，避免排队堆积
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 设置 JDK 17
        # AGP 8.7 + Kotlin 2.0.21 + Compose 编译器插件均要求 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 自动接受 SDK 许可协议（AGP 构建需要）
          accept-android-sdk-licenses: true

      - name: 安装编译所需 SDK 包
        # compileSdk/targetSdk = 34，需对应 platform 与 build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      # build.gradle.kts 的 fixedDebug 签名配置需要 android/app/debug.keystore。
      # 该文件已随仓库提交（尽管根 .gitignore 含此条目，当初以 git add -f 强制纳入），
      # 其证书指纹与 ApkVerifier.kt 的 EXPECTED_CERT_SHA256 绑定，必须长期稳定复用；
      # 因此 CI 直接复用仓库内已提交的 keystore，不再用 keytool 重新生成
      # （重新生成会变更证书指纹，导致打出的 APK 在运行时自校验失败）。

      # 签名指纹钉死：本仓库的 debug.keystore 自提交 0b1cc86 起固定不变，
      # 所有发布版 APK 均用它签名，用户可跨版本覆盖安装、且 App 内 ApkVerifier 自校验通过。
      # 若任何人误换/重建 keystore，此处立即失败，避免在不知情下发出
      # 「与上一版签名不同、已装用户无法升级」的 APK。
      # 期望值必须与 android/app/.../ApkVerifier.kt 的 EXPECTED_CERT_SHA256 保持一致。
      - name: 校验签名密钥指纹（钉死）
        working-directory: android/app
        run: |
          EXPECTED="5f717babca23523dd831228aa5f155cf6315bd6f5b5c7c049ec47d9786504f1d"
          ACTUAL=$(openssl pkcs12 -in debug.keystore -clcerts -nokeys -passin pass:android 2>/dev/null \
            | openssl x509 -fingerprint -sha256 -noout 2>/dev/null \
            | sed 's/.*=//; s/://g' | tr 'A-Z' 'a-z' | tr -d ' ')
          echo "keystore 证书 SHA-256: $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名密钥指纹不匹配预期值！疑似 android/app/debug.keystore 被更换，" \
                 "会导致已安装用户无法覆盖升级、且 App 内 ApkVerifier 自校验拒绝新包。" \
                 "请恢复提交 0b1cc86 以来的固定 keystore 后再构建（并保持与 ApkVerifier.EXPECTED_CERT_SHA256 一致）。"
            exit 1
          fi
          echo "✅ 签名密钥指纹校验通过（与 ApkVerifier.EXPECTED_CERT_SHA256 一致）"

      - name: 计算安卓版本号
        id: android_version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            # 使用 auto-tag 派发的统一版本号（vX.Y.Z）
            VER=${TAG#v}
          else
            # 手动派发未带 tag 时的兜底：自 latest v* 推导 patch+1
            LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              VER="0.0.0"
            else
              VER=${LATEST#v}
              MAJOR=$(echo "$VER" | cut -d. -f1)
              MINOR=$(echo "$VER" | cut -d. -f2)
              PATCH=$(echo "$VER" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VER="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          # Android 要求 versionCode 为正整数；此处使 versionCode 与 versionName 数值对应
          # （v0.0.1→1, v0.0.5→5, v1.2.3→10203），并对 v0.0.0 兜底为 1，保证 >=1 且单调递增
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          [ "$CODE" -eq 0 ] && CODE=1
          NEW_TAG="v${VER}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_name=$VER" >> "$GITHUB_OUTPUT"
          echo "new_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Android version: $NEW_TAG (versionName=$VER, versionCode=$CODE)"

      - name: 编译 Debug APK（注入版本号）
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PappVersionName="${{ steps.android_version.outputs.new_name }}" -PappVersionCode="${{ steps.android_version.outputs.new_code }}"

      - name: 重命名 APK 为 XinWallet 格式
        if: success()
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          mv "$APK_DIR/app-debug.apk" "$APK_DIR/XinWallet android ${{ steps.android_version.outputs.new_tag }}.apk"
          echo "APK renamed to: XinWallet android ${{ steps.android_version.outputs.new_tag }}.apk"

      - name: 创建 GitHub Release 并上传 APK
        # 仅在工作流派发（auto-tag 触发的正式发布）时创建 Release；PR 编译校验不发布
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.android_version.outputs.new_tag }}" \
            --title "XinWallet APP ${{ steps.android_version.outputs.new_tag }}" \
            --notes "自动构建的安卓 debug 安装包（debug 签名，可侧载安装，无需 Google Play）。\n\n安装方式：下载 XinWallet android ${{ steps.android_version.outputs.new_tag }}.apk 传到手机，允许「未知来源」后点击安装；或用 adb install 'XinWallet android ${{ steps.android_version.outputs.new_tag }}.apk'。" \
            "android/app/build/outputs/apk/debug/XinWallet android ${{ steps.android_version.outputs.new_tag }}.apk"
