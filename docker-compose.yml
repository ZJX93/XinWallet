# ============================================
# 鑫钱包 · Docker Compose（单文件 · PostgreSQL / MySQL 双数据库适配）
# ------------------------------------------------------------
# 一个文件覆盖全部部署形态，通过同目录 .env 的 DB_DIALECT / DB_HOST 切换：
#
#   1) 内置 PostgreSQL（默认）  docker compose --profile pg up -d
#   2) 内置 MySQL 8.0           docker compose --profile mysql up -d
#   3) 复用已有 / 外部数据库    docker compose up -d        （不启动内置库）
#
# app 内置数据库就绪探测（重试 30 次 / 约 60s），无需 depends_on 也能等待内置库就绪。
# 敏感变量全部来自 .env（已被 .gitignore 忽略，不会入库）。
# ============================================

services:
  # ---------- 内置 PostgreSQL（--profile pg，默认）----------
  db-pg:
    image: postgres:16-alpine
    container_name: xinwallet-db
    restart: unless-stopped
    profiles: ["pg"]
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xinwallet_changeme}
      POSTGRES_DB: ${DB_NAME:-xinwallet}
    volumes:
      - xinwallet-db-data:/var/lib/postgresql/data
    # 本地调试可临时取消注释暴露：- "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - xinwallet-net

  # ---------- 内置 MySQL 8.0（--profile mysql）----------
  db-mysql:
    image: mysql:8.0
    container_name: xinwallet-mysql
    restart: unless-stopped
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-xinwallet_changeme}
      MYSQL_DATABASE: ${DB_NAME:-xinwallet}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-log-bin
      - --skip-slave-start
    volumes:
      - xinwallet-mysql-data:/var/lib/mysql
    # 本地调试可临时取消注释暴露：- "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - xinwallet-net

  # ---------- 应用 ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/zjx93/xin-wallet/xinwallet:latest
    container_name: xinwallet-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 18888
      # 方言：pg（默认） / mysql
      DB_DIALECT: ${DB_DIALECT:-pg}
      # 内置库时指向容器名（db-pg / db-mysql）；复用外部库时填你已有库的地址
      DB_HOST: ${DB_HOST:-db-pg}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-xinwallet_changeme}
      DB_NAME: ${DB_NAME:-xinwallet}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      # ENCRYPTION_KEY 优先级：环境变量 > 数据卷持久化文件 > 启动时生成
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ALLOW_DEMO: ${ALLOW_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # 一键更新镜像（Web 端检测 + 应用）：镜像名与容器名，
      # 与下方 volumes 挂载的 docker.sock 配合使用
      UPDATE_IMAGE: ghcr.io/zjx93/xin-wallet/xinwallet:latest
      UPDATE_CONTAINER: xinwallet-app
    volumes:
      # 加密密钥持久化：与数据库同卷管理，docker compose down -v 才会清除
      - xinwallet-app-data:/app/data
      # 挂载宿主 Docker socket：允许容器内执行 docker 命令（一键更新镜像）。
      # ⚠️ 安全提示：docker.sock 等同宿主 root 权限，仅在你信任该自托管环境时启用；
      #   若关闭此挂载，Web 端「立即更新」将不可用（版本检测仍可用）。
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${APP_PORT:-18888}:18888"
    networks:
      - xinwallet-net

volumes:
  xinwallet-db-data:      # PostgreSQL 数据（沿用旧卷名，平滑迁移）
  xinwallet-mysql-data:   # MySQL 数据
  xinwallet-app-data:     # 应用数据（加密密钥 / /app/data）

networks:
  xinwallet-net:
    driver: bridge
