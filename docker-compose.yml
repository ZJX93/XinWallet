# ============================================
# 鑫钱包 · Docker Compose
# 应用容器 + PostgreSQL 容器，数据持久化于命名卷
# 所有敏感变量均来自同目录 .env（已被 .gitignore 忽略，不会入库）
#
# 用法：
#   docker compose up -d            # 拉取 GHCR 预构建镜像并启动
# ============================================

services:
  db:
    image: postgres:16-alpine
    container_name: xinwallet-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xinwallet_changeme}
      POSTGRES_DB: ${DB_NAME:-xinwallet}
    volumes:
      - xinwallet-db-data:/var/lib/postgresql/data
    ports:
      # 安全加固：默认不将数据库 5432 端口映射到宿主机，数据库仅在内部网络可达。
      # 本地调试可临时改为： - "127.0.0.1:5432:5432"
      # - "5432:5432"
    # NAS 上若想固定数据存放路径，可改为绑定挂载，例如：
    #   - /volume1/docker/xinwallet/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - xinwallet-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/zjx93/xin-wallet/xinwallet:latest
    container_name: xinwallet-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 18888
      DB_DIALECT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-xinwallet_changeme}
      DB_NAME: ${DB_NAME:-xinwallet}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      # ENCRYPTION_KEY 优先级：环境变量 > 数据卷持久化文件 > 启动时生成
      # 不传环境变量时，会自动从 /app/data/.encryption-key 读取或生成
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ALLOW_DEMO: ${ALLOW_DEMO}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      # 加密密钥持久化：与数据库同卷管理，docker-compose down -v 才会清除
      - xinwallet-app-data:/app/data
    ports:
      - "${APP_PORT:-18888}:18888"
    networks:
      - xinwallet-net

volumes:
  xinwallet-db-data:
  xinwallet-app-data:

networks:
  xinwallet-net:
    driver: bridge

