<!-- ===== 实验室 · AI 运维（原「AI 系统状态」改名，从顶栏齿轮迁到 AI 实验室侧栏） ===== -->
<!-- 2026-09 收纳：学习统计 + 画像设置 从「洞察」迁入，作为系统级运维面板 -->
<section class="page" id="page-ai-status" data-lazy="pages/ai-status.html">
    <div class="glass-card ai-page-card">
        <div class="ai-page-header">
            <div>
                <h3 class="card-title" data-i18n="aiStatus.title">运维</h3>
                <p class="card-desc" data-i18n="aiStatus.desc">系统监控、健康检查、学习统计、画像设置与运维工具</p>
            </div>
            <div class="ai-page-actions">
                <button class="btn btn-ghost btn-ai" id="aiToolsRefreshBtn" title="重新加载" data-i18n-title="aiStatus.reloadTip">↻ <span data-i18n="common.refresh">刷新</span></button>
            </div>
        </div>

        <div id="aiToolsErrorBar" class="ai-rules-error-bar" style="display:none"></div>

        <!-- 系统状态 -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title" data-i18n="aiStatus.section.status">系统状态</h4>
            <div class="ai-tools-grid" id="aiToolsStatus">
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header" data-i18n="aiStatus.card.eventBus">事件总线</div>
                    <div class="ai-tools-card-body" id="aiToolsEventBus"><span class="skeleton-line shimmer" style="width:60%"></span></div>
                </div>
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header" data-i18n="aiStatus.card.pendingFeedback">等待反馈</div>
                    <div class="ai-tools-card-body" id="aiToolsPendingFeedback"><span class="skeleton-line shimmer" style="width:40%"></span></div>
                </div>
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header" data-i18n="aiStatus.card.version">版本</div>
                    <div class="ai-tools-card-body" id="aiToolsVersion"><span class="skeleton-line shimmer" style="width:30%"></span></div>
                </div>
            </div>
        </div>

        <!-- 健康指标 -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title" data-i18n="aiStatus.section.metrics">健康指标</h4>
            <div class="ai-tools-grid" id="aiToolsMetrics">
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header" data-i18n="aiStatus.card.health">AI 健康</div>
                    <div class="ai-tools-card-body" id="aiToolsHealth"><span class="skeleton-line shimmer" style="width:70%"></span></div>
                </div>
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header" data-i18n="aiStatus.card.cost7d">7 日成本</div>
                    <div class="ai-tools-card-body" id="aiToolsCost"><span class="skeleton-line shimmer" style="width:50%"></span></div>
                </div>
            </div>
        </div>

        <!-- 功能开关 -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title" data-i18n="aiStatus.section.features">功能开关</h4>
            <div class="ai-tools-card" style="grid-column:1/-1">
                <div class="ai-tools-card-header" data-i18n="aiStatus.card.userFeatures">用户特性开关</div>
                <div class="ai-tools-card-body" id="aiToolsFeatures"><span class="skeleton-line shimmer" style="width:80%"></span></div>
            </div>
        </div>

        <!-- 学习统计（复用 AILearning 类，DOM 内嵌避免再创建独立 page） -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title" data-i18n="aiStatus.section.learning">学习统计</h4>
            <div id="aiLearningLoading" class="ai-page-loading" style="display:none">
                <div class="skeleton-wrap" data-skeleton="text">
                    <div class="skeleton-line shimmer" style="width:78%"></div>
                    <div class="skeleton-line shimmer" style="width:60%"></div>
                </div>
                <p class="ai-page-loading-text" data-i18n="aiLearning.loading">正在统计学习数据...</p>
            </div>
            <div id="aiLearningError" class="ai-rules-error-bar" style="display:none"></div>
            <div id="aiLearningBody" class="ai-learning-body"></div>
            <div style="text-align:right;margin-top:8px">
                <button class="btn btn-ghost btn-sm" id="aiLearningRefreshBtn" title="刷新" data-i18n-title="common.refresh">
                    <span class="ai-icon-refresh">↻</span> <span data-i18n="common.refresh">刷新</span>
                </button>
            </div>
        </div>

        <!-- 画像设置（直接 PATCH /ai/profile，无独立 Manager） -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title" data-i18n="aiStatus.section.profile">画像设置</h4>
            <div id="aiProfileErrorBar" class="ai-rules-error-bar" style="display:none"></div>
            <div class="ai-tools-card" style="grid-column:1/-1">
                <div class="ai-tools-card-body" id="aiProfileBody">
                    <div class="ai-profile-row">
                        <label for="aiProfileInteractionStyle" data-i18n="aiProfile.interactionStyle">交互风格</label>
                        <select id="aiProfileInteractionStyle" class="ai-profile-input">
                            <option value="concise" data-i18n="aiProfile.style.concise">简洁</option>
                            <option value="balanced" data-i18n="aiProfile.style.balanced">均衡</option>
                            <option value="detailed" data-i18n="aiProfile.style.detailed">详细</option>
                        </select>
                    </div>
                    <div class="ai-profile-row">
                        <label for="aiProfileNotification" data-i18n="aiProfile.notification">通知开关</label>
                        <label class="ai-profile-switch"><input type="checkbox" id="aiProfileNotification"><span></span></label>
                    </div>
                    <div class="ai-profile-row">
                        <label for="aiProfileFrequency" data-i18n="aiProfile.frequency">洞察频率</label>
                        <select id="aiProfileFrequency" class="ai-profile-input">
                            <option value="realtime" data-i18n="aiProfile.freq.realtime">实时</option>
                            <option value="daily" data-i18n="aiProfile.freq.daily">每日</option>
                            <option value="weekly" data-i18n="aiProfile.freq.weekly">每周</option>
                        </select>
                    </div>
                    <div class="ai-profile-row">
                        <label for="aiProfileThreshold" data-i18n="aiProfile.threshold">洞察阈值</label>
                        <input type="number" id="aiProfileThreshold" class="ai-profile-input" min="0" max="1" step="0.05">
                    </div>
                    <div style="text-align:right;margin-top:12px">
                        <button class="btn btn-primary btn-sm" id="aiProfileSaveBtn" data-i18n="aiProfile.save">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 运维操作（开发者工具收纳于此） -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title" data-i18n="aiStatus.section.ops">运维操作</h4>
            <div class="ai-tools-card" style="grid-column:1/-1">
                <div class="ai-tools-card-body" style="display:flex;gap:8px;flex-wrap:wrap">
                    <button class="btn btn-ghost btn-sm" id="aiToolsRunCleanup" data-i18n="aiStatus.runCleanup">运行清理</button>
                    <button class="btn btn-ghost btn-sm" id="aiToolsEmitEvent" data-i18n="aiStatus.emitEvent">触发测试事件</button>
                </div>
            </div>
        </div>
    </div>

    <style>
    .ai-tools-section { margin-top: 20px; }
    .ai-tools-section-title { font-size: 14px; font-weight: var(--fw-semibold); color: var(--text-secondary); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-subtle); }
    .ai-tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ai-tools-card { background: var(--surface-elevated); border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--border-subtle); }
    .ai-tools-card-header { font-size: 12px; font-weight: var(--fw-semibold); color: var(--text-tertiary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .ai-tools-card-body { font-size: 13px; color: var(--text-primary); line-height:1.6; }
    .ai-tools-card-body .tag-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: var(--surface-hover); margin: 2px; font-size: 12px; }
    .ai-profile-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; gap:12px; }
    .ai-profile-row label { font-size:13px; color:var(--text-secondary); }
    .ai-profile-input { padding:6px 10px; border-radius:6px; border:1px solid var(--border-subtle); background:var(--surface-elevated); color:var(--text-primary); font-size:13px; min-width:140px; }
    .ai-profile-switch { position:relative; display:inline-block; width:36px; height:20px; }
    .ai-profile-switch input { opacity:0; width:0; height:0; }
    .ai-profile-switch span { position:absolute; inset:0; background:var(--surface-hover); border-radius:20px; transition:0.2s; cursor:pointer; }
    .ai-profile-switch span::before { content:''; position:absolute; left:2px; top:2px; width:16px; height:16px; background:var(--text-secondary); border-radius:50%; transition:0.2s; }
    .ai-profile-switch input:checked + span { background:var(--accent); }
    .ai-profile-switch input:checked + span::before { transform:translateX(16px); background:#fff; }
    </style>
</section>
