<!-- ===== 实验室 · AI 系统状态（原运维页瘦身：仅保留系统级监控/运维，对话/画像/现金流预测已迁入「洞察」） ===== -->
<section class="page" id="page-ai-status" data-lazy="pages/ai-status.html">
    <div class="glass-card ai-page-card">
        <div class="ai-page-header">
            <div>
                <h3 class="card-title">AI 系统状态</h3>
                <p class="card-desc">系统监控、健康检查与运维工具</p>
            </div>
            <div class="ai-page-actions">
                <button class="btn btn-ghost btn-ai" id="aiToolsRefreshBtn" title="重新加载">↻ 刷新</button>
            </div>
        </div>

        <div id="aiToolsErrorBar" class="ai-rules-error-bar" style="display:none"></div>

        <!-- 系统状态 -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title">系统状态</h4>
            <div class="ai-tools-grid" id="aiToolsStatus">
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header">事件总线</div>
                    <div class="ai-tools-card-body" id="aiToolsEventBus"><span class="skeleton-line shimmer" style="width:60%"></span></div>
                </div>
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header">等待反馈</div>
                    <div class="ai-tools-card-body" id="aiToolsPendingFeedback"><span class="skeleton-line shimmer" style="width:40%"></span></div>
                </div>
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header">版本</div>
                    <div class="ai-tools-card-body" id="aiToolsVersion"><span class="skeleton-line shimmer" style="width:30%"></span></div>
                </div>
            </div>
        </div>

        <!-- 健康指标 -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title">健康指标</h4>
            <div class="ai-tools-grid" id="aiToolsMetrics">
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header">AI 健康</div>
                    <div class="ai-tools-card-body" id="aiToolsHealth"><span class="skeleton-line shimmer" style="width:70%"></span></div>
                </div>
                <div class="ai-tools-card">
                    <div class="ai-tools-card-header">7 日成本</div>
                    <div class="ai-tools-card-body" id="aiToolsCost"><span class="skeleton-line shimmer" style="width:50%"></span></div>
                </div>
            </div>
        </div>

        <!-- 功能开关 -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title">功能开关</h4>
            <div class="ai-tools-card" style="grid-column:1/-1">
                <div class="ai-tools-card-header">用户特性开关</div>
                <div class="ai-tools-card-body" id="aiToolsFeatures"><span class="skeleton-line shimmer" style="width:80%"></span></div>
            </div>
        </div>

        <!-- 运维操作（开发者工具收纳于此） -->
        <div class="ai-tools-section">
            <h4 class="ai-tools-section-title">运维操作</h4>
            <div class="ai-tools-card" style="grid-column:1/-1">
                <div class="ai-tools-card-body" style="display:flex;gap:8px;flex-wrap:wrap">
                    <button class="btn btn-ghost btn-sm" id="aiToolsRunCleanup">运行清理</button>
                    <button class="btn btn-ghost btn-sm" id="aiToolsEmitEvent">触发测试事件</button>
                </div>
            </div>
        </div>
    </div>

    <style>
    .ai-tools-section { margin-top: 20px; }
    .ai-tools-section-title { font-size: 14px; font-weight: var(--fw-semibold); color: var(--text-secondary); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-subtle); }
    .ai-tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ai-tools-card { background: var(--surface-elevated); border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--border-subtle); }
    .ai-tools-card-header { font-size: 12px; font-weight: var(--fw-semibold); color: var(--text-tertiary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .ai-tools-card-body { font-size: 13px; color: var(--text-primary); line-height:1.6; }
    .ai-tools-card-body .tag-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: var(--surface-hover); margin: 2px; font-size: 12px; }
    </style>
</section>
