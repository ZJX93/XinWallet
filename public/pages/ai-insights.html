<!--
  ===== AI 洞察（统一聚合「看账」入口）=====
  Tab：AI 建议 / 学习统计 / 现金流预测 / 画像 / 模型评测
  建议·学习·评测 为独立懒加载子页（复用原 Manager）；现金流·画像 内联并由本 Manager 直接拉取。
-->
<section class="page" id="page-ai-insights" data-lazy="pages/ai-insights.html">
    <div class="ai-insights-tabs" id="aiInsightsTabs" role="tablist">
        <button class="ai-insights-tab active" data-tab="advice" role="tab" aria-selected="true" data-i18n="aiInsights.tab.advice">AI 建议</button>
        <button class="ai-insights-tab" data-tab="learning" role="tab" aria-selected="false" data-i18n="aiInsights.tab.learning">学习统计</button>
        <button class="ai-insights-tab" data-tab="cashflow" role="tab" aria-selected="false" data-i18n="aiInsights.tab.cashflow">现金流预测</button>
        <button class="ai-insights-tab" data-tab="profile" role="tab" aria-selected="false" data-i18n="aiInsights.tab.profile">画像</button>
        <button class="ai-insights-tab" data-tab="evaluation" role="tab" aria-selected="false" data-i18n="aiInsights.tab.evaluation">模型评测</button>
    </div>
    <div id="aiInsightsAlerts" class="ai-insights-alerts" style="display:none"></div>

    <!-- 子页面容器：data-lazy 由 AIInsights manager 触发加载 -->
    <div id="page-ai-advice" data-lazy="pages/ai-advice.html"></div>
    <div id="page-ai-learning" data-lazy="pages/ai-learning.html" style="display:none"></div>
    <div id="page-ai-cashflow" style="display:none">
        <div class="glass-card">
            <h3 class="card-title" data-i18n="aiInsights.cashflow.title">现金流预测</h3>
            <p class="card-desc" data-i18n="aiInsights.cashflow.desc">基于历史收支与订阅 / 债务计划的未来现金流推算（最近 3 个月）</p>
            <div id="aiCashflowBody"><div class="skeleton-wrap" data-skeleton="text"><div class="skeleton-line shimmer" style="width:60%"></div></div></div>
        </div>
    </div>
    <div id="page-ai-profile" style="display:none">
        <div class="glass-card">
            <h3 class="card-title" data-i18n="aiInsights.profile.title">AI 画像</h3>
            <p class="card-desc" data-i18n="aiInsights.profile.desc">AI 从你的记账习惯中学习到的偏好与画像</p>
            <div id="aiProfileBody"><div class="skeleton-wrap" data-skeleton="text"><div class="skeleton-line shimmer" style="width:60%"></div></div></div>
        </div>
    </div>
    <div id="page-ai-evaluation" data-lazy="pages/ai-evaluation.html" style="display:none"></div>

    <style>
    .ai-cashflow-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-top:12px; }
    .ai-cashflow-val { font-size:22px; font-weight:var(--fw-semibold); color:var(--interactive-default); }
    .ai-insights-alerts { margin:12px 0 4px; display:flex; flex-direction:column; gap:8px; }
    .ai-alert { display:flex; gap:10px; padding:10px 12px; border-radius:12px; background:var(--surface-elevated); border:1px solid var(--border-subtle); align-items:flex-start; }
    .ai-alert-dot { width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none; }
    .ai-alert-warning { border-color:rgba(245,166,35,.4); } .ai-alert-warning .ai-alert-dot { background:#f5a623; }
    .ai-alert-danger, .ai-alert-error { border-color:rgba(235,87,87,.4); } .ai-alert-danger .ai-alert-dot, .ai-alert-error .ai-alert-dot { background:#eb5757; }
    .ai-alert-title { font-weight:var(--fw-semibold); font-size:13px; color:var(--text-primary); }
    .ai-alert-desc { font-size:12px; color:var(--text-secondary); margin-top:2px; }
    </style>
</section>
