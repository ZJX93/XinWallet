<!-- ===== AI 洞察 · 建议子页（POST /ai/advice；由 ai-insights.html Tab 容器懒加载） ===== -->
<section class="page" id="page-ai-advice" data-lazy="pages/ai-advice.html">
    <div class="glass-card ai-page-card">
        <div class="ai-page-header">
            <div>
                <h3 class="card-title">AI 建议</h3>
                <p class="card-desc">结合本地记账习惯与月度对比，给出可量化洞察与建议</p>
            </div>
            <button class="btn btn-ghost btn-ai" id="aiAdviceRefreshBtn" title="重新生成">
                <span class="ai-icon-refresh">↻</span> 刷新
            </button>
        </div>

        <div id="aiAdviceMeta" class="ai-page-meta"></div>

        <div id="aiAdviceLoading" class="ai-page-loading" style="display:none">
            <div class="skeleton-wrap" data-skeleton="text">
                <div class="skeleton-line shimmer" style="width:78%"></div>
                <div class="skeleton-line shimmer" style="width:60%"></div>
                <div class="skeleton-line shimmer" style="width:82%"></div>
            </div>
            <p class="ai-page-loading-text">正在分析你的财务数据...</p>
        </div>

        <!-- 洞察区（观察型：warning/info/tip） -->
        <div class="ai-insight-section">
            <h4 class="ai-section-title">消费洞察</h4>
            <div id="aiInsightList" class="ai-insight-list"></div>
        </div>

        <!-- 建议区（可执行：high/medium/low） -->
        <div class="ai-advice-section">
            <h4 class="ai-section-title">财务建议</h4>
            <div id="aiAdviceList" class="ai-advice-list"></div>
        </div>
    </div>
</section>
