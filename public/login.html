<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>登录 · 鑫钱包</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <!-- 按钮行楷字体：免费开源「志莽行书」(Zhi Mang Xing, OFL 授权) via Google Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=swap">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/login.css?v=2">
    <!-- API 基址推导 = 复用 js/config.js（路径豁免跳转） -->
    <script src="js/config.js"></script>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <span class="logo-icon"></span>
                <span class="logo-text">鑫钱包</span>
            </div>
            <p class="login-sub">Smart Finance · 个人财务管理</p>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
            </div>

            <form class="auth-form" id="authForm">
                <div class="form-group" id="authNickGroup" style="display:none">
                    <label>昵称</label>
                    <input type="text" id="authNick" placeholder="昵称（可选）" autocomplete="nickname">
                </div>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="authUser" required placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="authPass" required placeholder="请输入密码" autocomplete="current-password">
                </div>
                <!-- 「记住密码」：勾选后密码经 WebCrypto AES-GCM 加密存 localStorage，
                     密钥用 extractable:false 存 IndexedDB（JS 拿不到密钥原文）。
                     ⛔ 别改成直接 localStorage.setItem(密码) —— 那是明文，XSS 一读就走。 -->
                <label class="remember-row" for="authRemember">
                    <input type="checkbox" id="authRemember">
                    <span>记住密码</span>
                </label>
                <div class="auth-hint" id="authHint" role="status" aria-live="polite"></div>
                <button type="submit" class="btn btn-ghost btn-block" id="authSubmit">登 录</button>
            </form>

            <div class="demo-hint">
                <p>首次使用？可直接登录演示账号</p>
                <button type="button" class="btn btn-ghost btn-block" id="demoLoginBtn">👤 使用演示账号登录</button>
            </div>
        </div>
    </div>

    <!-- ⛔ 改 login.css / login.js 必须 bump 这里的 ?v= —— 原本这两个资源没带版本号，
         改完浏览器会一直吃缓存，表现为「代码改了没生效」。 -->
    <script src="js/utils.js"></script>
    <script src="js/login.js?v=4"></script>
</body>
</html>
