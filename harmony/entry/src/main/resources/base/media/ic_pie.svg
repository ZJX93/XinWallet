<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    统计页图标：饼图（对齐安卓 Icons.Outlined.PieChart）。

    ⚠️ 旧版这里画的是「圆环 + 对钩」（路径里 L11 13.2 l-3 -2.9 那段是对钩），
    视觉上等于一个「已完成 / 已勾选」图标，和「统计」毫无语义关联，
    而安卓底栏同一位置是饼图。属于跨端图标不一致。

    描边式（outlined）画法，与同栏 house / receipt / person 的线性风格统一：
      · 外圆用 stroke 而非 fill，线宽 1.8 与 SymbolGlyph 的视觉重量接近
      · 内部两条半径线（12 点方向 + 3 点方向）构成「扇区分割」，
        这是饼图区别于普通圆圈的唯一特征，必须有
    fill 留 none、stroke 用 currentColor 的等价物 #000000，
    由 Image().fillColor() 统一着色（选中品牌棕 / 未选中次级灰）。
  -->
  <g fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 3v9h9"/>
  </g>
</svg>
